services:
  postgres:
    image: postgres:16-alpine
    container_name: careerconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerconnect}
      POSTGRES_DB: ${POSTGRES_DB:-careerconnect}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerconnect}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careerconnect-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: careerconnect-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: careerconnect-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/careerconnect-media;
      /usr/bin/mc anonymous set none local/careerconnect-media;
      exit 0;
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: careerconnect-api
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - faiss_data:/app/data
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-dev-insecure-secret-key-for-local-testing}
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://${POSTGRES_USER:-careerconnect}:${POSTGRES_PASSWORD:-careerconnect}@postgres:5432/${POSTGRES_DB:-careerconnect}
      - REDIS_URL=redis://redis:6379
      - USE_REDIS_CACHE=True
      - CELERY_ALWAYS_EAGER=False
      - USE_S3_STORAGE=True
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_STORAGE_BUCKET_NAME=careerconnect-media
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - CSRF_TRUSTED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: careerconnect-celery-worker
    restart: unless-stopped
    command: celery -A job.celery app worker -l info --concurrency=2
    volumes:
      - ./backend:/app
      - faiss_data:/app/data
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-dev-insecure-secret-key-for-local-testing}
      - DATABASE_URL=postgres://${POSTGRES_USER:-careerconnect}:${POSTGRES_PASSWORD:-careerconnect}@postgres:5432/${POSTGRES_DB:-careerconnect}
      - REDIS_URL=redis://redis:6379
      - USE_REDIS_CACHE=True
      - CELERY_ALWAYS_EAGER=False
      - USE_S3_STORAGE=True
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_STORAGE_BUCKET_NAME=careerconnect-media
      - AWS_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerconnect-celery-beat
    restart: unless-stopped
    command: celery -A job.celery app beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-dev-insecure-secret-key-for-local-testing}
      - DATABASE_URL=postgres://${POSTGRES_USER:-careerconnect}:${POSTGRES_PASSWORD:-careerconnect}@postgres:5432/${POSTGRES_DB:-careerconnect}
      - REDIS_URL=redis://redis:6379
      - CELERY_ALWAYS_EAGER=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerconnect-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  faiss_data:
