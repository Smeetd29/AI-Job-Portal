# DeepEval & Generation Evaluation Configuration
judge:
  model: "gpt-4o-mini"
  fallback_model: "claude-3-haiku-20240307"
  temperature: 0.0
  max_retries: 3
  timeout_seconds: 30

metrics:
  faithfulness:
    threshold: 0.80
    include_reason: true
  answer_relevancy:
    threshold: 0.75
    include_reason: true
  contextual_relevancy:
    threshold: 0.70
  geval:
    criteria:
      recommendation_explanation: "Evaluate whether the explanation accurately connects verified candidate skills and experience to job requirements without exaggerating or hallucinating facts."
      resume_summary: "Evaluate whether the resume summary concisely and accurately represents the candidate's core background, skills, and projects without inventing unstated qualifications."
    threshold: 0.75

offline_mode:
  allow_deterministic_fallback: true
  mock_judge_for_tests: true
