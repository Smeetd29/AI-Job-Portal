apiVersion: batch/v1
kind: CronJob
metadata:
  name: careerconnect-faiss-reindex
  namespace: careerconnect
  labels:
    app.kubernetes.io/name: careerconnect
    app.kubernetes.io/component: faiss-reindex
spec:
  schedule: "0 2 * * *" # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: careerconnect
            app.kubernetes.io/component: faiss-reindex
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: reindex
              image: ghcr.io/careerconnect/backend:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -c
                - "from application.ai.index_service import FAISSIndexManager; count = FAISSIndexManager.rebuild_job_index(); print(f'Indexed {count} jobs.')"
              envFrom:
                - configMapRef:
                    name: careerconnect-config
                - secretRef:
                    name: careerconnect-secrets
              env:
                - name: FAISS_INDEX_DIR
                  value: /app/data/faiss_index
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 2000m
                  memory: 2Gi
              volumeMounts:
                - name: faiss-storage
                  mountPath: /app/data
          volumes:
            - name: faiss-storage
              persistentVolumeClaim:
                claimName: careerconnect-faiss-pvc
