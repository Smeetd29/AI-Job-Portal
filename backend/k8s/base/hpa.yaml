apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: careerconnect-api-hpa
  namespace: careerconnect
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: careerconnect-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: careerconnect-worker-hpa
  namespace: careerconnect
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: careerconnect-celery-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
