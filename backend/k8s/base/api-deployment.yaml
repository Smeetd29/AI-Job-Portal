apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerconnect-api
  namespace: careerconnect
  labels:
    app.kubernetes.io/name: careerconnect
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: careerconnect
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: careerconnect
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: sync-faiss-index
          image: amazon/aws-cli:2.15.15
          command:
            - sh
            - -c
            - |
              echo "Initializing FAISS index directory..."
              mkdir -p /app/data/faiss_index
              if [ -n "$S3_FAISS_BUCKET" ]; then
                echo "Syncing index from s3://${S3_FAISS_BUCKET}/faiss_index..."
                aws s3 sync s3://${S3_FAISS_BUCKET}/faiss_index /app/data/faiss_index
              else
                echo "No S3_FAISS_BUCKET configured; using local index directory."
              fi
          env:
            - name: S3_FAISS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: careerconnect-config
                  key: S3_FAISS_BUCKET
                  optional: true
          volumeMounts:
            - name: faiss-storage
              mountPath: /app/data
      containers:
        - name: api
          image: ghcr.io/careerconnect/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - gunicorn
            - job.wsgi:application
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "3"
            - --threads
            - "2"
            - --timeout
            - "60"
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: careerconnect-config
            - secretRef:
                name: careerconnect-secrets
          env:
            - name: FAISS_INDEX_DIR
              value: /app/data/faiss_index
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: faiss-storage
              mountPath: /app/data
            - name: tmp-volume
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
      volumes:
        - name: faiss-storage
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
