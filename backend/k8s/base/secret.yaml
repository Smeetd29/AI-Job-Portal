apiVersion: v1
kind: Secret
metadata:
  name: careerconnect-secrets
  namespace: careerconnect
  annotations:
    external-secrets.io/managed: "placeholder-replace-with-external-secret-in-production"
type: Opaque
stringData:
  # Sensitive placeholders for Kubernetes deployment. Replace via ExternalSecrets, Vault, or SealedSecrets.
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_DJANGO_SECRET_KEY_PLACEHOLDER"
  DATABASE_URL: "postgres://careerconnect:CHANGE_ME_PASSWORD@postgres:5432/careerconnect"
  POSTGRES_PASSWORD: "CHANGE_ME_PASSWORD"
  AWS_ACCESS_KEY_ID: "CHANGE_ME_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_AWS_SECRET_KEY"
  AWS_S3_ENDPOINT_URL: "http://minio:9000"
  ANTHROPIC_API_KEY: "CHANGE_ME_ANTHROPIC_KEY"
  HUGGINGFACE_API_KEY: ""
  PILOT_INVITED_EMAILS: ""
