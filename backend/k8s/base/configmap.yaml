apiVersion: v1
kind: ConfigMap
metadata:
  name: careerconnect-config
  namespace: careerconnect
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "careerconnect.example.com,api.careerconnect.example.com,localhost,127.0.0.1,api,frontend"
  CORS_ALLOWED_ORIGINS: "https://careerconnect.example.com,http://localhost:5173"
  CSRF_TRUSTED_ORIGINS: "https://careerconnect.example.com,http://localhost:5173"
  REDIS_URL: "redis://redis:6379"
  USE_REDIS_CACHE: "True"
  CELERY_ALWAYS_EAGER: "False"
  USE_S3_STORAGE: "True"
  AWS_STORAGE_BUCKET_NAME: "careerconnect-media"
  AWS_S3_REGION_NAME: "us-east-1"
  AUTO_APPLY_AGENT_ENABLED: "True"
  SCREENING_AGENT_ENABLED: "True"
  DIGEST_AGENT_ENABLED: "True"
  SCHEDULING_AGENT_ENABLED: "True"
