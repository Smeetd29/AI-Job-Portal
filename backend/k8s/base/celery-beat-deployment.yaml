apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerconnect-celery-beat
  namespace: careerconnect
  labels:
    app.kubernetes.io/name: careerconnect
    app.kubernetes.io/component: celery-beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: careerconnect
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: careerconnect
        app.kubernetes.io/component: celery-beat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: celery-beat
          image: ghcr.io/careerconnect/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - job.celery
            - app
            - beat
            - -l
            - info
          envFrom:
            - configMapRef:
                name: careerconnect-config
            - secretRef:
                name: careerconnect-secrets
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: tmp-volume
          emptyDir: {}

