apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careerconnect-ingress
  namespace: careerconnect
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m" # For resume PDF uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - careerconnect.example.com
      secretName: careerconnect-tls-secret
  rules:
    - host: careerconnect.example.com
      http:
        paths:
          # API & Admin Backend Routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /jobs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /applications
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /saved-jobs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /profile
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /logout
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          # Frontend SPA default route
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
