apiVersion: apps/v1
kind: Deployment
metadata:
  name: careerconnect-celery-worker
  namespace: careerconnect
  labels:
    app.kubernetes.io/name: careerconnect
    app.kubernetes.io/component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: careerconnect
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: careerconnect
        app.kubernetes.io/component: celery-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: sync-faiss-index
          image: amazon/aws-cli:2.15.15
          command:
            - sh
            - -c
            - |
              echo "Initializing FAISS index directory..."
              mkdir -p /app/data/faiss_index
              if [ -n "$S3_FAISS_BUCKET" ]; then
                echo "Syncing index from s3://${S3_FAISS_BUCKET}/faiss_index..."
                aws s3 sync s3://${S3_FAISS_BUCKET}/faiss_index /app/data/faiss_index
              else
                echo "No S3_FAISS_BUCKET configured; using local index directory."
              fi
          env:
            - name: S3_FAISS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: careerconnect-config
                  key: S3_FAISS_BUCKET
                  optional: true
          volumeMounts:
            - name: faiss-storage
              mountPath: /app/data
      containers:
        - name: celery-worker
          image: ghcr.io/careerconnect/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - job.celery
            - app
            - worker
            - -l
            - info
            - --concurrency=2
          envFrom:
            - configMapRef:
                name: careerconnect-config
            - secretRef:
                name: careerconnect-secrets
          env:
            - name: FAISS_INDEX_DIR
              value: /app/data/faiss_index
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: faiss-storage
              mountPath: /app/data
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: faiss-storage
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}

