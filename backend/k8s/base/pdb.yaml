apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: careerconnect-api-pdb
  namespace: careerconnect
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: careerconnect
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: careerconnect-worker-pdb
  namespace: careerconnect
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: careerconnect
      app.kubernetes.io/component: celery-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: careerconnect-frontend-pdb
  namespace: careerconnect
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: careerconnect
      app.kubernetes.io/component: frontend
