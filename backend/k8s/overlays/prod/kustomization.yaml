apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: careerconnect-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: careerconnect-celery-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: careerconnect-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: ConfigMap
      name: careerconnect-config
    patch: |-
      - op: replace
        path: /data/ALLOWED_HOSTS
        value: "careerconnect.example.com,api.careerconnect.example.com,frontend,api"
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: "https://careerconnect.example.com"
      - op: replace
        path: /data/CSRF_TRUSTED_ORIGINS
        value: "https://careerconnect.example.com"
